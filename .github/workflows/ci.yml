name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first: it's the alpha platform (spec §37).
        # ubuntu-latest moves to Ubuntu 26 in Oct 2026; pin to 24.04 until tested.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - name: Smoke test CLI
        run: cargo run -q -p where_cli -- --db ci.db demo

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/where_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=linux,windows,macos --project-name where_flutter .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
